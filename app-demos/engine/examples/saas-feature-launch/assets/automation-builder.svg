    <text x="912" y="410" fill="#A74A45" font-size="13" font-weight="700">NO · MESSAGE</text>
    <text x="912" y="443" fill="#171A1F" font-size="18" font-weight="700">Offer a setup session</text>
    <text x="912" y="465" fill="#7A838F" font-size="13">In-app · Human support</text>

    <rect x="880" y="500" width="318" height="104" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
    <text x="912" y="536" fill="#68717D" font-size="13" font-weight="700">WAIT</text>
    <text x="912" y="569" fill="#171A1F" font-size="18" font-weight="700">2 business days</text>
