    <text x="430" y="593" fill="#7A838F" font-size="13">Email · Product education</text>

    <rect x="398" y="678" width="260" height="104" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
    <text x="430" y="714" fill="#68717D" font-size="13" font-weight="700">GOAL</text>
    <text x="430" y="747" fill="#171A1F" font-size="18" font-weight="700">Activated account</text>

    <rect x="880" y="374" width="318" height="104" rx="8" fill="#FFFFFF" stroke="#F0C3BF" stroke-width="2"/>
