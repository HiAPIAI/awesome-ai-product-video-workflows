  <rect x="1228" y="70" width="212" height="830" fill="#FFFFFF"/>
  <text x="1254" y="116" fill="#171A1F" font-family="Arial" font-size="17" font-weight="700">Journey health</text>
  <text x="1254" y="158" fill="#7A838F" font-family="Arial" font-size="13">5 steps</text>
  <text x="1254" y="188" fill="#7A838F" font-family="Arial" font-size="13">2 branches</text>
  <text x="1254" y="218" fill="#7A838F" font-family="Arial" font-size="13">0 conflicts</text>
  <rect x="1254" y="252" width="160" height="40" rx="6" fill="#EAF8F1"/>
  <text x="1334" y="278" text-anchor="middle" fill="#26734E" font-family="Arial" font-size="13" font-weight="700">Ready to test</text>
