  <rect x="1286" y="16" width="130" height="38" rx="6" fill="#171A1F"/>
  <text x="1351" y="41" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="14" font-weight="700">Publish</text>

  <rect y="70" width="236" height="830" fill="#20242B"/>
  <text x="26" y="112" fill="#8F99A7" font-family="Arial" font-size="12" font-weight="700">STEPS</text>
  <g font-family="Arial" font-size="15">
    <rect x="18" y="132" width="200" height="52" rx="6" fill="#2C323B"/><circle cx="44" cy="158" r="9" fill="#55C995"/><text x="64" y="164" fill="#FFFFFF">Trigger</text>
    <rect x="18" y="196" width="200" height="52" rx="6" fill="#2C323B"/><rect x="36" y="222" width="16" height="16" rx="3" fill="#FFBF5B"/><text x="64" y="228" fill="#FFFFFF">Condition</text>
    <rect x="18" y="260" width="200" height="52" rx="6" fill="#2C323B"/><path d="M36 279h18v14H36z" fill="#2D8CFF"/><text x="64" y="292" fill="#FFFFFF">Message</text>
    <rect x="18" y="324" width="200" height="52" rx="6" fill="#2C323B"/><path d="M44 341v18M35 350h18" stroke="#F06A63" stroke-width="3"/><text x="64" y="356" fill="#FFFFFF">Delay</text>
  </g>

  <g stroke="#CBD2DB" stroke-width="3" fill="none">
    <path d="M528 254v72"/><path d="M528 432v70"/><path d="M528 606v72"/>
    <path d="M760 552h120"/><path d="M760 552v-126h120"/>
  </g>
  <g font-family="Arial">
    <rect x="398" y="148" width="260" height="106" rx="8" fill="#FFFFFF" stroke="#BFE8D2" stroke-width="2"/>
    <rect x="398" y="148" width="8" height="106" rx="4" fill="#55C995"/>
    <text x="430" y="184" fill="#23734D" font-size="13" font-weight="700">TRIGGER</text>
    <text x="430" y="217" fill="#171A1F" font-size="18" font-weight="700">Trial started</text>
    <text x="430" y="239" fill="#7A838F" font-size="13">Immediately after signup</text>

    <rect x="398" y="326" width="260" height="106" rx="8" fill="#FFFFFF" stroke="#E8D6A6" stroke-width="2"/>
    <rect x="398" y="326" width="8" height="106" rx="4" fill="#FFBF5B"/>
