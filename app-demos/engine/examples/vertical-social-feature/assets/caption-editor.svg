<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Clipnote mobile caption editor</title>
  <desc id="desc">A fictional vertical video editor showing transcript segments and an auto-caption action.</desc>
  <rect width="900" height="1600" fill="#ECEEF2"/>
  <rect x="96" y="30" width="708" height="1540" rx="72" fill="#15171C"/>
  <rect x="116" y="50" width="668" height="1500" rx="56" fill="#F9FAFB"/>
  <rect x="366" y="70" width="168" height="26" rx="13" fill="#15171C"/>
  <text x="168" y="146" fill="#181A1F" font-family="Arial" font-size="25" font-weight="700">Clipnote</text>
  <text x="734" y="146" text-anchor="end" fill="#7357D9" font-family="Arial" font-size="18" font-weight="700">Export</text>

  <rect x="168" y="196" width="564" height="700" rx="8" fill="#1D2026"/>
  <rect x="252" y="238" width="396" height="616" rx="8" fill="#CAD9E3"/>
  <rect x="286" y="274" width="328" height="224" rx="8" fill="#88A7B8"/>
  <circle cx="450" cy="386" r="54" fill="#F4C36B"/>
  <rect x="318" y="540" width="264" height="94" rx="8" fill="#F4F6F8"/>
  <rect x="344" y="570" width="212" height="18" rx="8" fill="#20242B"/>
  <rect x="366" y="604" width="168" height="14" rx="7" fill="#7357D9"/>
  <rect x="304" y="744" width="292" height="62" rx="8" fill="#17191E"/>
  <text x="450" y="784" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="21" font-weight="700">Raw product demo</text>
  <circle cx="450" cy="548" r="36" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="m439 530 28 18-28 18z" fill="#7357D9"/>

  <text x="168" y="954" fill="#181A1F" font-family="Arial" font-size="23" font-weight="700">Transcript</text>
  <rect x="168" y="986" width="564" height="78" rx="8" fill="#EEEAFB" stroke="#CFC4F1"/>
  <text x="190" y="1018" fill="#6046B5" font-family="Arial" font-size="13" font-weight="700">00:00.0</text>
  <text x="190" y="1048" fill="#2B2E34" font-family="Arial" font-size="17">Here is the fastest way to share a launch update.</text>
  <rect x="168" y="1080" width="564" height="78" rx="8" fill="#FFFFFF" stroke="#D9DDE3"/>
  <text x="190" y="1112" fill="#7B828C" font-family="Arial" font-size="13" font-weight="700">00:02.8</text>
  <text x="190" y="1142" fill="#2B2E34" font-family="Arial" font-size="17">Choose the feature and export the vertical cut.</text>

  <rect x="168" y="1258" width="564" height="76" rx="8" fill="#7357D9"/>
  <text x="450" y="1307" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="23" font-weight="700">Generate captions</text>
  <text x="450" y="1384" text-anchor="middle" fill="#767D87" font-family="Arial" font-size="17">2 transcript segments detected</text>
